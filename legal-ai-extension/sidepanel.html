<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juridisk AI</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- Source modal (bottom sheet) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-left">
          <span class="modal-type-badge" id="modal-type-badge"></span>
          <div class="modal-title" id="modal-title"></div>
        </div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-excerpt" id="modal-excerpt"></div>
      <div class="modal-demo-note">
        I en fullständig implementation öppnas denna källa direkt i Qura, Legora, riksdagen.se eller domstol.se.
      </div>
      <button class="modal-open-btn" id="modal-open-btn">Öppna demolänk ↗</button>
    </div>
  </div>

  <header class="header">
    <div class="header-inner">
      <span class="header-icon">⚖</span>
      <div>
        <div class="header-title">Juridisk AI</div>
        <div class="header-sub">Intelligent juridisk granskning</div>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- Text att rätta -->
    <div class="card" id="text-card">
      <div class="section-label">
        Text att rätta
        <span class="text-badge empty" id="text-badge">Ingen text vald</span>
      </div>
      <div class="source-btns">
        <button class="source-btn" id="btn-fetch-selection">↻ Hämta markering</button>
        <button class="source-btn source-btn-secondary" id="btn-fetch-page">📄 Hela sidan</button>
      </div>
      <textarea
        class="text-textarea"
        id="text-area"
        rows="5"
        placeholder="Klistra in juridisk text här, eller använd knapparna ovan…"
      ></textarea>
      <div class="text-footer">
        <button class="clear-btn" id="btn-clear">✕ Rensa text</button>
        <span class="clear-confirm" id="clear-confirm">Texten har rensats</span>
      </div>
      <div class="source-error" id="source-error" style="display:none"></div>
    </div>

    <!-- Formulär -->
    <div class="card">
      <div class="form-group">
        <div class="section-label" style="margin-bottom:8px">Rättsområde</div>
        <div class="pill-row" id="area-group">
          <button class="pill" data-value="avtalsrätt">Avtalsrätt</button>
          <button class="pill selected" data-value="associationsrätt">Associationsrätt</button>
          <button class="pill" data-value="statsrätt">Statsrätt</button>
          <button class="pill" data-value="straffrätt">Straffrätt</button>
        </div>
      </div>

      <div class="form-group">
        <div class="section-label" style="margin-bottom:8px">Rättningsläge</div>
        <div class="mode-toggle" id="mode-group">
          <button class="mode-btn selected" data-value="tentarättning">Tentarättning</button>
          <button class="mode-btn" data-value="vanligjuridiskgranskning">Juridisk granskning</button>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" disabled>Rätta</button>
    </div>

    <!-- Progress -->
    <div class="card" id="progress-card" style="display:none">
      <div class="progress-header">
        <span class="progress-label-text">Analyserar med AI…</span>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-step-text" id="progress-step">Läser juridisk text…</div>
    </div>

    <!-- Resultat -->
    <div id="results-section" style="display:none">
      <div class="card grade-card" id="grade-card">
        <div class="grade-ring" id="grade-ring">
          <span class="grade-text" id="grade-text">—</span>
        </div>
        <div class="grade-info">
          <div class="grade-name" id="grade-name"></div>
          <div class="grade-score-line" id="grade-score-line"></div>
          <div class="grade-summary" id="grade-summary"></div>
        </div>
      </div>
      <div id="feedback-sections"></div>
    </div>

  </main>

  <script src="demo-data.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
